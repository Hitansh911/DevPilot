name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        # We skip tests here by default since the default Spring Boot test requires 
        # a PgVector database to be running. If you write unit tests that don't need a DB,
        # you can remove -DskipTests.
        run: mvn -B clean package -DskipTests

  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        # NEXT_PUBLIC_API_BASE_URL is required at build time. We provide a dummy one for CI.
        env:
          NEXT_PUBLIC_API_BASE_URL: https://devpilot-ci.com
        run: npm run build
