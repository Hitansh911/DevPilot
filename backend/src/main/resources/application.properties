spring.application.name=backend
spring.profiles.active=secrets

# Defaults match docker-compose.yml (postgres on host port 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mistral - embeddings only
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:}
spring.ai.mistralai.embedding.options.model=mistral-embed

# Hugging Face - chat only (called directly via WebClient, no Spring AI starter)
huggingface.api-key=${HUGGINGFACE_API_KEY:}
huggingface.chat.model=openai/gpt-oss-20b:groq

# Disable Mistral's chat model so only HF's ChatModel bean exists
spring.autoconfigure.exclude=org.springframework.ai.model.mistralai.autoconfigure.MistralAiChatAutoConfiguration

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

#Github OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID:Ov23lirfd5vTNycS45Du}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

#App Settings
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50